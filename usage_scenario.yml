---
name: Pacing energy sweep
author: Didi <didi@green-coding.io>
description: >-
  Steady-state video streaming (16 Mbit/s, 4 s chunks) between two containers on
  one machine. Every phase moves the same bytes over the same 60 s and only the
  server pacing rate changes (SO_MAX_PACING_RATE via an X-Pace-Rate header, as in
  Sammy). Energy differences between phases therefore come from traffic shape:
  race-to-idle bursts versus spread-out paced delivery. Conditions are
  interleaved ascending, descending, ascending to cancel thermal drift.

# Each phase prints one sample of these; GMT sums them per phase.
custom_metrics:
  onperiod_kbps:
    unit: kbit/s
  duty_permille:
    unit: permille
  host_ctxt_per_s:
    unit: 1/s
  deep_cstate_permille:
    unit: permille
  late_chunks:
    unit: chunks

services:
  server:
    image: python:3.12-slim
    command: python3 /tmp/repo/server.py
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1', 8080), 2)"]
      interval: 1s
      timeout: 3s
      retries: 30
  client:
    image: python:3.12-slim
    command: sleep infinity
    depends_on:
      server:
        condition: service_healthy

flow:
  - name: idle start
    container: client
    commands:
      - type: console
        command: python3 /tmp/repo/client.py --label idle_start --idle
        log-stdout: true
        log-stderr: true
  - name: unpaced r1
    container: client
    commands:
      - type: console
        command: python3 /tmp/repo/client.py --label unpaced_r1 --pace-mbps 0
        log-stdout: true
        log-stderr: true
  - name: pace 1000M r1
    container: client
    commands:
      - type: console
        command: python3 /tmp/repo/client.py --label pace_1000M_r1 --pace-mbps 1000
        log-stdout: true
        log-stderr: true
